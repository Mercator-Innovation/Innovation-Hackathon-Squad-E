<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How it works: Night Neighbours (prototype)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="journey.css">
</head>
<body>
  <!-- The core journey in five steps. Owned by Kai. Words are in content-journey.js. -->
  <header class="top"><a href="index.html" data-text="service.name"></a></header>
  <main class="journey">
    <h1 data-text="journey.title"></h1>

    <!-- Daniel's video, with Jamie's voice: it starts the story -->
    <section class="journey-video" aria-labelledby="video-title">
      <h2 id="video-title" data-text="journey.videoTitle"></h2>
      <iframe id="journey-video" src="no-phone-video/index.html" title="Night Neighbours: no phone, no problem, a narrated video"></iframe>
      <p><a href="no-phone-video/index.html" data-text="journey.videoFull"></a></p>
    </section>

    <p data-text="journey.intro"></p>
    <p class="no-details" data-text="journey.noDetails"></p>

    <ol class="steps" id="steps"></ol>

    <section class="behind" aria-labelledby="behind-title">
      <h2 id="behind-title" data-text="journey.behindTitle"></h2>
      <p data-text="journey.behindText"></p>
      <p class="see-links" id="behind-links"></p>
    </section>

    <p class="emergency" data-text="safety.emergency"></p>
  </main>

  <script src="content.js"></script>
  <script src="content-journey.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
  <script src="journey.js"></script>
</body>
</html>
