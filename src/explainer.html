<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Neighbours: three journeys (explainer)</title>
<!-- Daniel Lambert-Maddocks, Ctrl-Alt-Elite, 22 October. A self-playing explainer of the three key journeys.
     Everything here is made up. Record it as a video with Cmd+Shift+5 on a Mac. -->
<style>
:root {
  --ink: #1d2433; --muted: #4a5568; --bg: #f6f4ef; --card: #ffffff;
  --night: #24406b; --night-dark: #172b4a; --lamp: #f2b544; --line: #d6d1c4;
  --focus: #ffbf47; --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: 1.0625rem; line-height: 1.5; color: var(--ink); background: var(--bg); }
main { max-width: 60rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
h1 { color: var(--night); font-size: 1.5rem; margin: .25rem 0 .75rem; }
.player { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.art { background: var(--night-dark); aspect-ratio: 16 / 9; }
.art svg { display: block; width: 100%; height: 100%; }
.caption { padding: 1rem 1.25rem 1.25rem; min-height: 15rem; }
.chapter { display: inline-block; background: var(--lamp); color: var(--ink); font-weight: 600; font-size: .9rem; padding: .15rem .6rem; border-radius: 999px; }
.time { color: var(--muted); font-size: .95rem; margin-left: .5rem; }
.caption h2 { color: var(--night); font-size: 1.35rem; margin: .5rem 0 .5rem; }
.caption p { margin: .35rem 0; }
.solves { border-left: 4px solid var(--lamp); padding-left: .75rem; margin-top: .75rem !important; }
.solves strong { color: var(--night); }
.bar { display: flex; gap: 3px; padding: 0 1.25rem; }
.seg { flex: 1; height: 8px; border: 0; padding: 0; background: var(--line); border-radius: 4px; cursor: pointer; position: relative; overflow: hidden; }
.seg span { position: absolute; inset: 0; width: 0; background: var(--night); }
.seg.done span { width: 100%; }
.controls { display: flex; flex-wrap: wrap; gap: .5rem; padding: .9rem 1.25rem 1.1rem; align-items: center; }
button.btn { font: inherit; font-weight: 600; border: 2px solid var(--night); background: var(--card); color: var(--night); padding: .45rem .9rem; border-radius: var(--radius); cursor: pointer; }
button.btn.primary { background: var(--night); color: #fff; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.jump { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }
.jump button { font: inherit; font-size: .9rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: .3rem .6rem; border-radius: 999px; cursor: pointer; }
.jump button[aria-current="true"] { background: var(--lamp); border-color: var(--lamp); }
.note { color: var(--muted); font-size: .95rem; margin-top: 1rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .pop { opacity: 0; animation: pop .7s ease-out forwards; }
  .glow { animation: glow 1.6s ease-in-out infinite; }
  .walk { animation: walk 3s ease-in-out forwards; }
  .caption.enter { animation: fade .5s ease-out; }
}
@keyframes pop { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes walk { from { transform: translateX(-120px); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 40rem) { .jump { margin-left: 0; } .caption { min-height: 19rem; } }
</style>
</head>
<body>
<main>
  <h1>Night Neighbours: three journeys</h1>
  <div class="player" role="region" aria-label="Explainer video">
    <div class="art" id="art" aria-hidden="true"></div>
    <div class="bar" id="bar" role="group" aria-label="Scenes"></div>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="controls">
      <button class="btn" id="prev" type="button">Back</button>
      <button class="btn primary" id="play" type="button">Pause</button>
      <button class="btn" id="next" type="button">Next</button>
      <div class="jump" id="jump" role="group" aria-label="Go to a journey"></div>
    </div>
  </div>
  <p class="note">About 2 minutes. Everything here is made up: the people, places and messages. Keys: space to pause, arrows to move. To record it as a video on a Mac, press Cmd+Shift+5.</p>
</main>

<script>
// ---------- Drawing helpers (simple shapes, 640 x 360) ----------
const C = { sky: '#172b4a', sky2: '#24406b', lamp: '#f2b544', paper: '#f6f4ef', ink: '#1d2433', line: '#d6d1c4', soft: '#8fa3c7', green: '#6fcf97' };
let d = 0; // stagger delay for pop-in
const pop = (svg) => `<g class="pop" style="animation-delay:${(d += 0.35).toFixed(2)}s">${svg}</g>`;
const sky = () => `<rect width="640" height="360" fill="${C.sky}"/>
  <circle cx="560" cy="60" r="26" fill="${C.paper}"/><circle cx="572" cy="52" r="24" fill="${C.sky}"/>
  ${[[60,40],[140,80],[230,30],[330,70],[420,35],[480,95],[90,120],[620,140]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.8" fill="${C.paper}" opacity=".7"/>`).join('')}
  <rect y="300" width="640" height="60" fill="#10203a"/>`;
const text = (x, y, s, size = 20, fill = C.paper, w = 600) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="middle" font-family="system-ui, sans-serif">${s}</text>`;
const person = (x, y, body = C.lamp, s = 1, label = '') => `<g transform="translate(${x} ${y}) scale(${s})">
  <circle cx="0" cy="-62" r="16" fill="${C.paper}"/><rect x="-20" y="-44" width="40" height="52" rx="16" fill="${body}"/>
  ${label ? text(0, 30, label, 16, C.paper, 500) : ''}</g>`;
const phone = (x, y, lines, h = 170) => `<g transform="translate(${x} ${y})">
  <rect x="-55" y="0" width="110" height="${h}" rx="14" fill="${C.ink}" stroke="${C.soft}" stroke-width="2"/>
  <rect x="-47" y="12" width="94" height="${h - 30}" rx="6" fill="${C.paper}"/>
  ${lines.map((l, i) => `<rect x="-40" y="${22 + i * 34}" width="80" height="26" rx="5" fill="${l[1] || C.sky2}"/>${text(0, 40 + i * 34, l[0], 11, l[2] || C.paper, 600)}`).join('')}</g>`;
const bubble = (x, y, s, w = 150) => `<g transform="translate(${x} ${y})"><rect x="${-w/2}" y="-20" width="${w}" height="36" rx="18" fill="${C.paper}"/>${text(0, 4, s, 15, C.ink, 600)}</g>`;
const locker = (x, y) => `<g transform="translate(${x} ${y})">
  <rect x="0" y="0" width="200" height="190" rx="6" fill="#3b5a8a"/>
  ${[0,1,2].map(r => [0,1,2,3].map(c => (r === 1 && c > 0 && c < 3) ? '' : `<rect x="${10 + c * 46}" y="${10 + r * 58}" width="40" height="50" rx="3" fill="#2d4a75" stroke="${C.soft}" stroke-width="1"/>`).join('')).join('')}
  <rect x="58" y="70" width="84" height="48" rx="4" fill="${C.paper}"/>${text(100, 92, 'HELP POINT', 11, C.ink, 700)}${text(100, 108, 'charge · text · help', 9, C.ink, 500)}</g>`;
const helpButton = (x, y) => `<g transform="translate(${x} ${y})"><circle r="34" fill="${C.lamp}" class="glow" opacity=".4"/><circle r="24" fill="${C.lamp}"/>${text(0, 6, 'HELP', 14, C.ink, 800)}</g>`;
const hub = (x, y) => `<g transform="translate(${x} ${y})"><polygon points="0,40 70,0 140,40" fill="#3b5a8a"/><rect x="10" y="40" width="120" height="80" fill="#2d4a75"/>
  <rect x="25" y="58" width="32" height="28" fill="${C.lamp}" class="glow"/><rect x="83" y="58" width="32" height="28" fill="${C.lamp}"/><rect x="58" y="84" width="24" height="36" fill="${C.ink}"/>${text(70, 140, 'Local hub', 15, C.paper, 600)}</g>`;
const billboard = (x, y, lines) => `<g transform="translate(${x} ${y})"><rect x="-6" y="120" width="12" height="70" fill="${C.soft}"/>
  <rect x="-130" y="0" width="260" height="125" rx="6" fill="${C.paper}" stroke="${C.lamp}" stroke-width="4"/>
  ${lines.map((l, i) => text(0, 36 + i * 30, l, i === 0 ? 21 : 15, C.ink, i === 0 ? 800 : 500)).join('')}</g>`;
const pin = (x, y, n) => `<g transform="translate(${x} ${y})"><circle r="${8 + n * 3}" fill="${C.lamp}" opacity=".85"/>${text(0, 5, n * 10, 12, C.ink, 700)}</g>`;
const shop = (x, y) => `<g transform="translate(${x} ${y})"><rect width="230" height="120" fill="#2d4a75"/><rect x="0" y="-22" width="230" height="22" fill="${C.sky2}"/>${text(115, -6, 'SUPERMARKET (open late)', 13, C.paper, 700)}
  <rect x="15" y="20" width="60" height="60" fill="${C.lamp}" opacity=".85"/><rect x="155" y="20" width="60" height="60" fill="${C.lamp}" opacity=".85"/><rect x="95" y="40" width="40" height="80" fill="${C.ink}"/></g>`;
const card = (x, y, w, h, title, sub) => `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="10" fill="${C.paper}"/>${text(w/2, h/2 - 2, title, 16, C.night || C.sky2, 700)}${sub ? text(w/2, h/2 + 20, sub, 12, C.ink, 500) : ''}</g>`;

// ---------- The scenes ----------
const J1 = 'Journey 1: with a phone', J2 = 'Journey 2: without a phone', J3 = 'Journey 3: volunteers', JS = 'Night Neighbours';
const scenes = [
  { ch: JS, time: '', title: 'Someone nearby when it\'s late and you\'re on your own',
    what: 'Night Neighbours connects three groups of people: the person in need, their family circle, and a support cohort of local volunteers and care workers.',
    solves: 'Most support for people affected by substance use is open 9 to 5, Monday to Friday, but people are often most alone at night.',
    art: () => sky() + pop(person(170, 280, C.lamp, 1.3, 'Person in need')) + pop(person(320, 280, C.soft, 1.3, 'Family circle')) + pop(person(470, 280, C.green, 1.3, 'Support cohort')) },

  { ch: J1, time: '23:10', title: 'Jamie feels low and on his own',
    what: 'It\'s late. Jamie is at home, restless and low. The services he knows are all closed.',
    solves: 'Help usually closes in the evening and at weekends, often exactly when it\'s needed.',
    art: () => sky() + pop(`<rect x="200" y="150" width="240" height="150" fill="#2d4a75"/><rect x="240" y="180" width="60" height="50" fill="${C.lamp}" class="glow"/>`) + pop(person(380, 290, C.lamp, 1.1)) + pop(bubble(380, 140, 'Who\'s up at this hour?', 210)) },

  { ch: J1, time: '23:12', title: 'He opens Night Neighbours, or sends a text',
    what: 'On his phone he opens the Night Neighbours website. With no data, he can text a short code like TALK instead.',
    solves: 'Phones get in the way: little data, low battery or no signal. A text works on any phone.',
    art: () => sky() + pop(phone(220, 95, [['Night Neighbours', C.sky2], ['Get some company', C.lamp, C.ink], ['Text TALK to 60000', C.sky2]])) + pop(`<path d="M300 180 C340 150, 380 150, 420 180" stroke="${C.lamp}" stroke-width="3" fill="none" stroke-dasharray="6 6"/>`) + pop(bubble(450, 200, 'TALK', 90)) },

  { ch: J1, time: '23:13', title: 'Three clear choices',
    what: 'The first screen explains itself: I need someone, Go to a help point, or I\'m a volunteer.',
    solves: 'Support is spread across lots of organisations and is hard to find. One simple start point takes the guesswork out.',
    art: () => sky() + pop(card(120, 70, 400, 60, 'I need someone', 'to talk to, to come to me, or a bed')) + pop(card(120, 145, 400, 60, 'Go to a help point', 'charge up, text, or press for help')) + pop(card(120, 220, 400, 60, 'I\'m a volunteer', 'see requests near me tonight')) },

  { ch: J1, time: '23:20', title: 'A neighbour answers, and his sister knows',
    what: 'A vetted volunteer nearby says "I can help" and calls him. Because Jamie chose it, his sister Karen gets a message too.',
    solves: 'People feel safer and less alone. Families often don\'t know how to help, so this brings them in, with Jamie in control.',
    art: () => sky() + pop(person(160, 280, C.lamp, 1.1, 'Jamie')) + pop(person(330, 280, C.green, 1.1, 'Volunteer')) + pop(person(500, 280, C.soft, 1.1, 'Karen')) + pop(bubble(330, 150, 'I can help', 130)) + pop(bubble(500, 120, 'Jamie asked for company', 220)) },

  { ch: J2, time: '22:40', title: 'A sign where he already goes',
    what: 'Night Neighbours posters and digital billboards sit in the space of mainstream supermarkets: "Not OK tonight? There\'s a help point by the lockers."',
    solves: 'People without a phone never see an app. Signs in everyday places reach them, without singling anyone out.',
    art: () => sky() + pop(shop(380, 180)) + pop(billboard(190, 80, ['Not OK tonight?', 'Help point by the lockers.', 'Open all night.'])) + pop(person(300, 300, C.lamp, .9)) },

  { ch: J2, time: '22:45', title: 'The locker help point',
    what: 'At the parcel lockers he can charge a phone for free and read what\'s open tonight. If he has no phone, he can pick up a charged phone donated to charity.',
    solves: 'No device, no battery and no data stop people reaching help. The help point fixes all three.',
    art: () => sky() + pop(locker(120, 105)) + pop(phone(430, 120, [['Charged', C.green, C.ink], ['Donated phone', C.sky2], ['Take one free', C.lamp, C.ink]], 150)) + pop(text(430, 300, 'Free to take', 15, C.paper, 600)) },

  { ch: J2, time: '22:47', title: 'One button to get someone',
    what: 'He presses the help button. A local Night Neighbours care worker is alerted, and patrols already cover the areas that need it most.',
    solves: 'Services are mostly in cities and people may have no transport. Help comes to him instead.',
    art: () => sky() + pop(locker(100, 105)) + pop(helpButton(355, 200)) + pop(`<path d="M395 200 C440 180, 470 180, 500 200" stroke="${C.lamp}" stroke-width="3" fill="none" stroke-dasharray="6 6"/>`) + pop(`<g class="walk">${person(540, 290, C.green, 1, 'Care worker')}</g>`) },

  { ch: J2, time: '23:30', title: 'Stay put, or go to the hub for the night',
    what: 'He can wait where he is for the care worker, or walk to the local hub, which stays open late. Someone is with him through the night.',
    solves: 'Nights are when people are most vulnerable and isolated. A warm, safe place means he isn\'t alone, without it feeling like an emergency service.',
    art: () => sky() + pop(hub(400, 160)) + pop(`<path d="M150 300 L380 300" stroke="${C.lamp}" stroke-width="3" stroke-dasharray="8 8"/>`) + pop(person(170, 290, C.lamp, 1, 'Jamie')) + pop(person(270, 290, C.green, 1)) },

  { ch: J3, time: 'Any day', title: 'Signing up to help',
    what: 'Local people sign up as Night Neighbours on the website. They\'re checked before they can take requests.',
    solves: 'Services can\'t cover every night alone. A trusted group of local volunteers fills the gaps.',
    art: () => sky() + pop(phone(220, 95, [['Become a', C.sky2], ['Night Neighbour', C.lamp, C.ink], ['Sign up', C.green, C.ink]])) + pop(person(430, 280, C.green, 1.2, 'New volunteer')) },

  { ch: J3, time: 'Before the first shift', title: 'Guidance and training',
    what: 'Volunteers get short training and guidance: how to listen without judging, how to stay safe at night, and when to pass someone to professional help.',
    solves: 'People want to help but don\'t know how. Training keeps everyone safe and uses person-first, non-judgemental language.',
    art: () => sky() + pop(card(90, 80, 220, 50, 'Listening without judging')) + pop(card(90, 145, 220, 50, 'Staying safe at night')) + pop(card(90, 210, 220, 50, 'When to call in professionals')) + pop(person(470, 280, C.green, 1.2, 'Volunteer')) },

  { ch: J3, time: 'Tonight', title: 'Their local hub, and requests nearby',
    what: 'Each volunteer is linked to their local hub. On shift, they see requests near them and can say "I can help" or "Not right now".',
    solves: 'Support varies from place to place. Linking volunteers to a hub makes sure each area has people ready.',
    art: () => sky() + pop(hub(80, 160)) + pop(phone(420, 95, [['Someone nearby', C.sky2], ['I can help', C.lamp, C.ink], ['Not right now', C.sky2]])) + pop(person(300, 290, C.green, 1)) },

  { ch: JS, time: 'Months on', title: 'Showing councils where help is missing',
    what: 'Anonymised totals, with no names, show requests and volunteers by area. Areas with too few volunteers are flagged for a person to check.',
    solves: 'Funding doesn\'t always follow need. These totals help local authorities plan more funding, resources and support where it\'s needed.',
    art: () => sky() + pop(`<path d="M220 60 L300 40 L360 90 L420 80 L440 160 L400 250 L320 290 L250 260 L210 180 Z" fill="#2d4a75" stroke="${C.soft}" stroke-width="2"/>`) + pop(pin(290, 110, 2)) + pop(pin(370, 150, 4)) + pop(pin(300, 220, 3)) + pop(pin(380, 240, 1)) + pop(text(520, 150, 'No names,', 18) + text(520, 176, 'only totals', 18)) }
];

// ---------- The player ----------
const $ = (id) => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let i = 0, playing = true, started = 0, elapsed = 0;
const dur = (s) => Math.max(6500, (s.what + s.solves).split(/\s+/).length * 230);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

$('bar').innerHTML = scenes.map((s, n) => `<button class="seg" type="button" aria-label="Scene ${n + 1}: ${esc(s.title)}"><span></span></button>`).join('');
const chapters = [J1, J2, J3];
$('jump').innerHTML = chapters.map(c => `<button type="button">${c.split(':')[0]}</button>`).join('');
$('bar').querySelectorAll('.seg').forEach((b, n) => b.addEventListener('click', () => go(n)));
$('jump').querySelectorAll('button').forEach((b, n) => b.addEventListener('click', () => go(scenes.findIndex(s => s.ch === chapters[n]))));

function show() {
  const s = scenes[i];
  d = 0;
  $('art').innerHTML = `<svg viewBox="0 0 640 360" role="img">${s.art()}</svg>`;
  const cap = $('caption');
  cap.classList.remove('enter'); void cap.offsetWidth; cap.classList.add('enter');
  cap.innerHTML = `<span class="chapter">${esc(s.ch)}</span>${s.time ? `<span class="time">${esc(s.time)}</span>` : ''}
    <h2>${esc(s.title)}</h2><p>${esc(s.what)}</p>
    <p class="solves"><strong>Problem it solves:</strong> ${esc(s.solves)}</p>`;
  $('bar').querySelectorAll('.seg').forEach((b, n) => { b.classList.toggle('done', n < i); b.querySelector('span').style.width = n < i ? '100%' : '0'; b.setAttribute('aria-current', n === i ? 'step' : 'false'); });
  $('jump').querySelectorAll('button').forEach((b, n) => b.setAttribute('aria-current', String(s.ch === chapters[n])));
}
function tick() {
  const total = dur(scenes[i]);
  const t = elapsed + (playing ? performance.now() - started : 0);
  $('bar').children[i].querySelector('span').style.width = Math.min(100, t / total * 100) + '%';
  if (t >= total) { if (i < scenes.length - 1) go(i + 1); else setPlaying(false); }
}
setInterval(() => { if (playing) tick(); }, 100);
function go(n) {
  i = Math.max(0, Math.min(scenes.length - 1, n));
  elapsed = 0; started = performance.now();
  show();
}
function setPlaying(p) {
  if (p && !playing && i === scenes.length - 1 && elapsed >= dur(scenes[i]) - 50) { playing = true; $('play').textContent = 'Pause'; go(0); return; }
  if (p === playing) return;
  if (p) started = performance.now();
  else elapsed += performance.now() - started;
  playing = p;
  $('play').textContent = p ? 'Pause' : (i === scenes.length - 1 && elapsed >= dur(scenes[i]) - 50 ? 'Play again' : 'Play');
}
$('play').addEventListener('click', () => setPlaying(!playing));
$('prev').addEventListener('click', () => go(i - 1));
$('next').addEventListener('click', () => go(i + 1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('button') &&(e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') go(i + 1);
  if (e.key === 'ArrowLeft') go(i - 1);
});
if (reduce) { playing = false; $('play').textContent = 'Play'; }
go(0);
</script>
</body>
</html>
