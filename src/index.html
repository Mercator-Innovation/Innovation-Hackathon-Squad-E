<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Neighbours (prototype)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <!-- The banner: "Who is this for?" buttons, built from audiences.js. Each opens that person's page. -->
  <header class="top banner">
    <a href="index.html" class="brand" data-text="service.name"></a>
    <nav id="who-nav" aria-label="Who is this for?"></nav>
  </header>

  <main class="home">
    <h1 data-text="service.name"></h1>
    <p data-text="service.tagline"></p>
    <p data-text="home.intro"></p>
    <p class="note" data-text="service.prototypeNote"></p>

    <!-- Daniel's explainer -->
    <section class="explainer-embed" aria-labelledby="explainer-heading">
      <h2 id="explainer-heading" data-text="home.explainer"></h2>
      <iframe id="explainer" src="explainer.html" title="Night Neighbours: three journeys, a self-playing explainer"></iframe>
      <p><a href="explainer.html" data-text="home.explainerFull"></a></p>
    </section>

    <p class="emergency" data-text="safety.emergency"></p>
  </main>

  <script src="content.js"></script>
  <script src="content-more.js"></script>
  <script src="content-refer.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
  <script src="audiences.js"></script>
  <script src="home.js"></script>

</html>
