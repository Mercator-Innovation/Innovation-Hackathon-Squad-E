<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support worker: Night Neighbours (prototype)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="more.css">
</head>
<body>
  <header class="top"><a href="index.html" data-text="service.name"></a></header>
  <main>
    <h1 data-text="worker.title"></h1>
    <p class="note" data-text="worker.madeUp"></p>

    <section class="group">
      <h2 data-text="worker.morningTitle"></h2>
      <p data-text="worker.morningIntro"></p>
      <div id="overnight"></div>
      <p class="note" id="not-shared"></p>
    </section>

    <section class="group">
      <h2 data-text="worker.handoverTitle"></h2>
      <p data-text="worker.handoverIntro"></p>
      <form id="handover-form" novalidate>
        <div id="caseload"></div>
        <div class="actions"><button type="submit" data-text="worker.send"></button></div>
      </form>
      <p class="status" id="handover-status" aria-live="polite"></p>
    </section>

    <section class="group">
      <h2 data-text="worker.rotaTitle"></h2>
      <p data-text="worker.rotaIntro"></p>
      <ul class="facts" id="rota"></ul>
    </section>
  </main>

  <script src="content.js"></script>
  <script src="content-more.js"></script>
  <script src="data/worker.js"></script>
  <script src="app.js"></script>
  <script src="worker.js"></script>
</body>
</html>
